<div class="forgot-page">
  <mat-card class="forgot-card">
    <h1>Reset password</h1>

    <p class="subtitle">
      Enter your email, the code received by email, and your new password.
    </p>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input
        matInput
        type="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        placeholder="example@gmail.com"
      />
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      type="button"
      class="main-button secondary-action"
      [disabled]="isSubmitting()"
      (click)="sendCode()"
    >
      Send code
    </button>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Reset code</mat-label>
      <input
        matInput
        type="text"
        [ngModel]="code()"
        (ngModelChange)="code.set($event)"
        placeholder="6-digit code"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New password</mat-label>
      <input
        matInput
        type="password"
        [ngModel]="newPassword()"
        (ngModelChange)="newPassword.set($event)"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm new password</mat-label>
      <input
        matInput
        type="password"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
      />
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      type="button"
      class="main-button"
      [disabled]="isSubmitting()"
      (click)="resetPassword()"
    >
      Reset password
    </button>

    @if (message()) {
      <div class="message success">
        {{ message() }}
      </div>
    }

    @if (error()) {
      <div class="message error">
        {{ error() }}
      </div>
    }

    <a class="back-link" routerLink="/login">
      Back to sign in
    </a>
  </mat-card>
</div>
