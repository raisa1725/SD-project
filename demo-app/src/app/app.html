<mat-toolbar class="main-toolbar">
  <span class="toolbar-title">HikeAlong</span>

  @if (!isLoginPage()) {
    @if (role() === 'ADMIN') {
      <a mat-button routerLink="/admin/persons">Manage Users</a>
      <a mat-button routerLink="/admin/events">Manage Events</a>
      <a mat-button routerLink="/admin/reservations">Manage Reservations</a>
    }

    @if (role() === 'USER') {
      <a mat-button routerLink="/feed">Events</a>
    }

    @if (role() === 'ORGANIZER') {
      <a mat-button routerLink="/feed">Events</a>
      <a mat-button routerLink="/organizer/my-events">My Events</a>
      <a mat-button routerLink="/organizer/reservations" routerLinkActive="active-link">
        Reservations
      </a>
    }

    <a mat-button routerLink="/profile">My Profile</a>

    <span class="toolbar-spacer"></span>

    <button
      mat-button
      type="button"
      class="theme-toggle-btn"
      (click)="toggleTheme()"
      [attr.aria-label]="themeLabel()"
      [title]="themeLabel()"
    >
      <span class="theme-emoji">{{ themeIcon() }}</span>
    </button>

    <button mat-button type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  }
</mat-toolbar>

<main class="content">
  <router-outlet></router-outlet>
</main>
